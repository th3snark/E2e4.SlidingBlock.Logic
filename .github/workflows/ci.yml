name: CI

# Manual only, to save Actions minutes: `gh workflow run ci.yml --ref <branch>` (Windows minutes cost double).
on:
  workflow_dispatch:
    inputs:
      ubuntu-26:
        description: Also test on ubuntu-26.04
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.ubuntu-26 && '["ubuntu-24.04","ubuntu-26.04","windows-latest"]' || '["ubuntu-24.04","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Check formatting
        if: runner.os == 'Windows'
        run: dotnet format whitespace E2e4.SlidingBlock.Logic.slnx --verify-no-changes
      - name: Check type keywords
        if: runner.os == 'Windows'
        run: dotnet format style E2e4.SlidingBlock.Logic.slnx --verify-no-changes --diagnostics IDE0049 --severity warn
      - name: Test
        run: dotnet test E2e4.SlidingBlock.Logic.slnx --configuration Release
      - name: Check for vulnerable packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet list E2e4.SlidingBlock.Logic.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q 'has the following vulnerable packages' vulnerable.txt; then
            echo 'A dependency has a known vulnerability.'
            exit 1
          fi
      - name: Pack
        run: dotnet pack src/E2e4.SlidingBlock.Logic/E2e4.SlidingBlock.Logic.csproj --configuration Release --no-build --output artifacts
      - name: Only System.Memory (netstandard2.0) as a dependency
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          # The same rule as scripts/check.ps1: net8.0 and net10.0 take nothing, netstandard2.0 takes System.Memory for Span<T>.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem artifacts -Filter 'E2e4.SlidingBlock.Logic.*.nupkg' | Where-Object Name -notlike '*.symbols.*' | Select-Object -First 1
          $zip = [IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
              $entry = $zip.Entries | Where-Object FullName -eq 'E2e4.SlidingBlock.Logic.nuspec'
              $reader = [IO.StreamReader]::new($entry.Open())
              $nuspec = $reader.ReadToEnd()
              $reader.Dispose()
          }
          finally { $zip.Dispose() }
          $allowed = 'System.Memory'
          $unexpected = ([xml] $nuspec).package.metadata.dependencies.group | ForEach-Object {
              $group = $_
              @($group.dependency) | Where-Object { $_ -and ($group.targetFramework -notlike '.NETStandard*' -or $_.id -notin $allowed) } |
                  ForEach-Object { "$($group.targetFramework): $($_.id)" }
          }
          if ($unexpected) {
              Write-Host "Unexpected package dependencies: $($unexpected -join ', ')"
              exit 1
          }
